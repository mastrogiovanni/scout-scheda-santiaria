[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  NPM_FLAGS = "--omit=dev"
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD = "1"

[dev]
  command = "npm start"
  targetPort = 4173
  port = 8888
  autoLaunch = false

[functions]
  directory = "netlify/static-only"
  node_bundler = "esbuild"
